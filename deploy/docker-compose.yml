# 生产编排。CI 上传到服务器 /opt/terln-studio/deploy/，和该目录已有的 .env 一起启动。

name: terln-studio

services:
  app:
    image: ghcr.io/xiaolinbenben/terln-studio:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/atlas.db
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
    volumes:
      - atlas-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

volumes:
  atlas-data:
