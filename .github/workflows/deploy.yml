# 推送 main 时构建整个应用镜像，推到 GHCR，再用 SSH 密码登录服务器拉取并启动。
#
# 仓库 Variables:
#   DEPLOY_HOST  服务器 IP，必填
#   DEPLOY_USER  SSH 用户名，可选，默认 root
#
# 仓库 Secrets:
#   GHCR_PAT         GitHub PAT。classic token 需要 write:packages；私有仓库还要 repo
#   DEPLOY_PASSWORD  SSH 登录密码
#
# 服务器 /opt/terln-studio/deploy/.env 由人工维护，本工作流不会覆盖。
# 每次部署只上传 deploy/docker-compose.yml。

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy settings
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          [ -n "$DEPLOY_HOST" ] || { echo "缺少仓库变量 DEPLOY_HOST（服务器 IP）"; exit 1; }
          [ -n "$DEPLOY_PASSWORD" ] || { echo "缺少 Secret DEPLOY_PASSWORD（SSH 密码）"; exit 1; }
          [ -n "$GHCR_PAT" ] || { echo "缺少 Secret GHCR_PAT"; exit 1; }

      - name: Image name
        id: image
        run: |
          name="ghcr.io/xiaolinbenben/terln-studio"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "ref=${name}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH password
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass

          user="${DEPLOY_USER:-root}"
          export SSHPASS="$DEPLOY_PASSWORD"
          ssh_opts=(
            -o StrictHostKeyChecking=accept-new
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o NumberOfPasswordPrompts=1
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
          )
          remote="${user}@${DEPLOY_HOST}"

          sshpass -e ssh "${ssh_opts[@]}" "$remote" "mkdir -p /opt/terln-studio/deploy"
          sshpass -e scp "${ssh_opts[@]}" \
            deploy/docker-compose.yml \
            "${remote}:/opt/terln-studio/deploy/docker-compose.yml"

          remote_env="GHCR_PAT=$(printf '%q' "$GHCR_PAT") GHCR_USER=$(printf '%q' "$GHCR_USER")"
          sshpass -e ssh "${ssh_opts[@]}" "$remote" "${remote_env} sh -s" <<'EOF'
          set -eu
          cd /opt/terln-studio/deploy
          if [ ! -f .env ]; then
            echo "缺少 /opt/terln-studio/deploy/.env" >&2
            exit 1
          fi
          command -v docker >/dev/null 2>&1 || { echo "服务器未安装 Docker" >&2; exit 1; }
          docker compose version >/dev/null 2>&1 || { echo "服务器未安装 Docker Compose 插件" >&2; exit 1; }
          printf '%s\n' "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          unset GHCR_PAT
          docker compose pull app
          docker compose up -d --remove-orphans --wait --wait-timeout 180
          EOF
